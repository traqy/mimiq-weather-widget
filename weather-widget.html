<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .widget {
      background: linear-gradient(135deg, #16213e, #0f3460);
      border-radius: 20px;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      color: white;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .search {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
    }

    .search input {
      flex: 1;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .search input::placeholder { color: rgba(255, 255, 255, 0.5); }
    .search input:focus { background: rgba(255, 255, 255, 0.22); }

    .search button, .refresh-btn {
      padding: 0.65rem 1rem;
      border: none;
      border-radius: 10px;
      background: #e94560;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search button:hover, .refresh-btn:hover { background: #c73652; }

    .weather-main {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .city-name {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      opacity: 0.9;
    }

    .weather-icon {
      font-size: 5rem;
      line-height: 1;
      margin: 0.5rem 0;
    }

    .temperature {
      font-size: 3.5rem;
      font-weight: 700;
      line-height: 1;
    }

    .condition {
      font-size: 1rem;
      opacity: 0.75;
      margin-top: 0.4rem;
      text-transform: capitalize;
    }

    .details {
      display: flex;
      justify-content: space-around;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .detail-item { text-align: center; }
    .detail-label { opacity: 0.6; margin-bottom: 0.2rem; }
    .detail-value { font-weight: 600; }

    .refresh-btn { width: 100%; padding: 0.75rem; }

    .error {
      text-align: center;
      padding: 2rem 0;
      color: #e94560;
      font-size: 0.95rem;
    }

    .loading {
      text-align: center;
      padding: 2rem 0;
      opacity: 0.6;
      font-size: 0.95rem;
    }

    .api-note {
      margin-top: 1rem;
      font-size: 0.7rem;
      opacity: 0.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="search">
      <input type="text" id="city-input" placeholder="Enter city…" value="London" />
      <button onclick="fetchWeather()">Go</button>
    </div>
    <div id="weather-output">
      <div class="loading">Loading…</div>
    </div>
    <!-- Replace API_KEY below with a free OpenWeatherMap key from https://openweathermap.org/api -->
    <p class="api-note">API key is a placeholder. Replace API_KEY in source with a free OpenWeatherMap key.</p>
  </div>

  <script>
    // Get a free key at https://openweathermap.org/api (free tier covers current weather).
    const API_KEY = 'YOUR_OPENWEATHERMAP_API_KEY';

    const CONDITION_ICONS = {
      Clear: '☀️', Clouds: '☁️', Rain: '🌧️', Drizzle: '🌦️',
      Thunderstorm: '⛈️', Snow: '❄️', Mist: '🌫️', Fog: '🌫️',
      Haze: '🌫️', Dust: '🌪️', Sand: '🌪️', Ash: '🌋',
      Squall: '💨', Tornado: '🌪️',
    };

    let currentCity = 'London';

    function conditionIcon(main) {
      return CONDITION_ICONS[main] || '🌡️';
    }

    function renderWeather(data) {
      const icon = conditionIcon(data.weather[0].main);
      const temp = Math.round(data.main.temp);
      const feels = Math.round(data.main.feels_like);
      const humidity = data.main.humidity;
      const wind = Math.round(data.wind.speed * 3.6); // m/s → km/h
      const condition = data.weather[0].description;
      const city = data.name + (data.sys.country ? ', ' + data.sys.country : '');

      document.getElementById('weather-output').innerHTML = `
        <div class="weather-main">
          <div class="city-name">${city}</div>
          <div class="weather-icon">${icon}</div>
          <div class="temperature">${temp}°C</div>
          <div class="condition">${condition}</div>
        </div>
        <div class="details">
          <div class="detail-item">
            <div class="detail-label">Feels like</div>
            <div class="detail-value">${feels}°C</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Humidity</div>
            <div class="detail-value">${humidity}%</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Wind</div>
            <div class="detail-value">${wind} km/h</div>
          </div>
        </div>
        <button class="refresh-btn" onclick="refresh()">↻ Refresh</button>
      `;
    }

    function renderError(msg) {
      document.getElementById('weather-output').innerHTML = `
        <div class="error">${msg}</div>
        <button class="refresh-btn" onclick="refresh()">↻ Try again</button>
      `;
    }

    async function fetchWeather(city) {
      const input = document.getElementById('city-input');
      const target = (city || input.value).trim();

      if (!target) {
        input.focus();
        return;
      }

      currentCity = target;
      document.getElementById('weather-output').innerHTML = '<div class="loading">Loading…</div>';

      try {
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(target)}&appid=${API_KEY}&units=metric`;
        const res = await fetch(url);

        if (!res.ok) {
          renderError('Could not fetch weather. Check the city name or API key.');
          return;
        }

        const data = await res.json();
        renderWeather(data);
      } catch (_) {
        renderError('Network error. Check your connection and try again.');
      }
    }

    function refresh() {
      fetchWeather(currentCity);
    }

    document.getElementById('city-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') fetchWeather();
    });

    fetchWeather('London');
  </script>
</body>
</html>
